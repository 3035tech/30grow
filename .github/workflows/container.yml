name: Build container image

on:
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  analytics-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security regression gate
        run: npm run test:security

      - name: Public SEO and application-link regression gate
        run: node --test test/unit/public-marketing-seo.unit.test.js test/unit/public-site-url.unit.test.js test/unit/app-url.unit.test.js test/unit/product-landing-seo.unit.test.js

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Reset DTOV
        run: npm run dtov:reset

      - name: Validate Analytics schema and tenant scope
        env:
          DTOV: '1'
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: '55432'
          POSTGRES_DB: enneagram_dtov
          POSTGRES_USER: dtov
          POSTGRES_PASSWORD: dtov_local_only
          POSTGRES_SSL: 'false'
        run: node --test test/unit/analytics-schema.dtov.test.js

      - name: Explain Analytics hot paths
        env:
          DTOV: '1'
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: '55432'
          POSTGRES_DB: enneagram_dtov
          POSTGRES_USER: dtov
          POSTGRES_PASSWORD: dtov_local_only
          POSTGRES_SSL: 'false'
        run: npm run dtov:explain

      - name: Stop DTOV
        if: always()
        run: npm run dtov:down

  build-and-push-image:
    needs: analytics-contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main/tags)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            NEXT_PUBLIC_APP_URL=https://app.30grow.com
            NEXT_PUBLIC_SITE_URL=https://30grow.com
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Output Image Tags
        id: image-tags
        run: |
          echo "image_tag=${{ steps.meta.outputs.version }}"
          echo "image_tag=${{ steps.meta.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "image_id=${{ steps.push.outputs.imageid }}"
          echo "image_id=${{ steps.push.outputs.imageid }}" >> "$GITHUB_OUTPUT"

version: 0.2

env:
  variables:
    ECR_REPO: grow30-app
    NEXT_PUBLIC_APP_URL: https://app.30grow.com
    CONTAINER_NAME: app

phases:
  install:
    runtime-versions:
      nodejs: 22
  pre_build:
    commands:
      - npm ci
      - CI=true npm run test:release
      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
      - COMMIT_HASH=$(echo "$CODEBUILD_RESOLVED_SOURCE_VERSION" | cut -c 1-12)
      - IMAGE_TAG="${COMMIT_HASH}-${CODEBUILD_BUILD_NUMBER}"
      - IMAGE_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_REPO:$IMAGE_TAG"
  build:
    commands:
      - docker build --platform linux/amd64 --build-arg NEXT_PUBLIC_APP_URL="$NEXT_PUBLIC_APP_URL" -t "$IMAGE_URI" .
      - docker push "$IMAGE_URI"
  post_build:
    commands:
      - printf '[{"name":"%s","imageUri":"%s"}]' "$CONTAINER_NAME" "$IMAGE_URI" > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
